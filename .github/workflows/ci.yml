name: CI Python

on:
  push:
    branches: ["main", "development", "release"]
  pull_request:
    branches: ["main", "development", "release"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: biblioteca_web

    steps:
      - name: Baixa o código do repositório
        uses: actions/checkout@v4

      - name: Configura o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instala as dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Verifica sintaxe dos arquivos Python
        run: |
          python -m py_compile app.py

      - name: Executa os testes
        run: |
          if [ -d tests ] && [ "$(ls -A tests)" ]; then
            pytest
          else
            echo "Pasta tests vazia ou inexistente; nenhum teste executado."
          fi